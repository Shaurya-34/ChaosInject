name: Integration checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m venv .venv && .venv/bin/python -m pip install -r requirements.lock && .venv/bin/python -m pip install --no-deps -e .
      - run: .venv/bin/python -m pytest -q
      - run: .venv/bin/python scripts/export_contracts.py --check
      - run: npm ci && npm run types && npm run build
        working-directory: frontend
      - run: git diff --exit-code -- contracts/v1 frontend/src/generated.ts
      - run: npx playwright install --with-deps chromium && npm test
        working-directory: frontend
